name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Formatting matches .editorconfig
        run: |
          dotnet format whitespace lmake.slnx --verify-no-changes
          dotnet format style lmake.slnx --verify-no-changes --severity warn

      - name: No comments, LF line endings, version left to releases
        run: python scripts/check_rules.py --base ${{ github.event.pull_request.base.sha }}

      - name: Scripts compile
        run: python -m compileall -q scripts

  installers:
    name: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell half parses
        run: |
          for file in installers/install installers/uninstall; do
            sed '/^#>$/,$d' "$file" | sh -n
          done

      - name: PowerShell half parses
        shell: pwsh
        run: |
          $failed = $false

          foreach ($file in "installers/install", "installers/uninstall") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null

            foreach ($item in $errors) {
              Write-Host "${file}:$($item.Extent.StartLineNumber): $($item.Message)"
              $failed = $true
            }
          }

          if ($failed) { exit 1 }
