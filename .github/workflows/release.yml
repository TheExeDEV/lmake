name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        default: master
      version:
        description: Version to publish (empty uses LMake.csproj)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Find an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(python3 scripts/release.py version)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if gh api "repos/${{ github.repository }}/releases/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version will be released"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            asset: lmake-win-x64.exe
          - os: ubuntu-latest
            runtime: linux-x64
            asset: lmake-linux-x64
          - os: macos-15-intel
            runtime: osx-x64
            asset: lmake-osx-x64
          - os: macos-latest
            runtime: osx-arm64
            asset: lmake-osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test
        run: dotnet test --solution lmake.slnx -c Release

      - name: Publish
        run: python scripts/release.py publish ${{ matrix.runtime }} ${{ matrix.asset }} --version ${{ needs.check.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Release notes
        run: python3 scripts/release.py notes ${{ needs.check.outputs.version }} > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ needs.check.outputs.sha }}
          name: lmake ${{ needs.check.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          files: release-files/*
